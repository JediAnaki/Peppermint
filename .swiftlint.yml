# SwiftLint Configuration for Peppermint
# Generated by Claude Code

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - force_unwrapping
  - missing_docs

included:
  - Peppermint/Peppermint

excluded:
  - Peppermint/Peppermint.xcodeproj
  - Peppermint/PeppermintTests
  - Peppermint/PeppermintUITests
  - Peppermint/Peppermint/Resources

line_length:
  warning: 120
  error: 200

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 50
  error: 100

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - x
    - y
    - z
