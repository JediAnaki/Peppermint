name: Peppermint

options:
  bundleIdPrefix: com.peppermint
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.3"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  Peppermint:
    type: application
    platform: iOS
    sources:
      - path: Peppermint
        excludes:
          - "*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peppermint.app
        INFOPLIST_FILE: Peppermint/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "\"Peppermint/Preview Content\""
    dependencies: []

  PeppermintTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PeppermintTests
    dependencies:
      - target: Peppermint

  PeppermintUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PeppermintUITests
    dependencies:
      - target: Peppermint
